repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false

  - repo: local
    hooks:
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --quiet
        language: system
        types: [rust]
        pass_filenames: false

  - repo: local
    hooks:
      - id: cargo-doc
        name: cargo doc
        entry: cargo doc --no-deps --quiet
        language: system
        types: [rust]
        pass_filenames: false

  - repo: local
    hooks:
      - id: no-comment-decorations
        name: no decorative comment patterns
        entry: bash -c '! rg -l "^\s*//\s*[-=/*#~+—─━]{2,}" "$@"' _
        language: system
        types: [rust]

  - repo: local
    hooks:
      - id: no-confusable-unicode
        name: no confusable Unicode dashes/spaces (use ASCII instead)
        entry: scripts/check-confusable-unicode.sh
        language: script
        types: [text]
