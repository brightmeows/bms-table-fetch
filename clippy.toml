# ── Test concessions ──
# 测试代码中允许 unwrap/expect/索引（测试需要简洁断言）
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true

# ── 禁用同步 fs（项目使用 tokio::fs）──
# 在 spawn_blocking 闭包内使用 std::fs 的例外场景须加
# #[expect(clippy::disallowed_methods, reason = "inside spawn_blocking")]
disallowed-methods = [
  { path = "std::fs::read", reason = "use tokio::fs::read" },
  { path = "std::fs::write", reason = "use tokio::fs::write" },
  { path = "std::fs::read_to_string", reason = "use tokio::fs::read_to_string" },
  { path = "std::fs::remove_file", reason = "use tokio::fs::remove_file" },
  { path = "std::fs::remove_dir_all", reason = "use tokio::fs::remove_dir_all" },
  { path = "std::fs::create_dir", reason = "use tokio::fs::create_dir" },
  { path = "std::fs::create_dir_all", reason = "use tokio::fs::create_dir_all" },
  { path = "std::fs::rename", reason = "use tokio::fs::rename" },
  { path = "std::fs::metadata", reason = "use tokio::fs::metadata" },
  { path = "std::fs::copy", reason = "use tokio::fs::copy" },
  { path = "std::fs::canonicalize", reason = "use tokio::fs::canonicalize" },
  { path = "std::fs::File::open", reason = "use tokio::fs::File::open (or into_std in spawn_blocking)" },
  { path = "std::fs::File::create", reason = "use tokio::fs::File::create (or into_std in spawn_blocking)" },
  { path = "std::thread::spawn", reason = "use tokio::spawn or tokio::task::spawn_blocking" },
  { path = "std::mem::zeroed", reason = "use MaybeUninit" },
]

# ── 禁用 print/dbg（使用 log）──
disallowed-macros = [
  { path = "std::println", reason = "use log::info!/warn!/error!" },
  { path = "std::eprintln", reason = "use log::info!/warn!/error!" },
  { path = "std::print", reason = "use log::info!/warn!/error!" },
  { path = "std::eprint", reason = "use log::info!/warn!/error!" },
  { path = "std::dbg", reason = "remove before commit" },
  { path = "std::todo", reason = "implement or use log::warn! for incomplete paths" },
]
