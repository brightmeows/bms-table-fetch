[package]
name = "bms-table-fetch"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://github.com/MiyakoMeow/bms-table-mirror"
description = ""

[lib]
name = "bms_table_fetch"
path = "src/lib.rs"

[[bin]]
name = "bms-table-fetch"
path = "src/main.rs"

[dependencies]
bms-table = "0.12"
reqwest = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }

env_logger = "0.11"
log = "0.4"
anyhow = "1"
url = { version = "2", features = ["serde"] }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
