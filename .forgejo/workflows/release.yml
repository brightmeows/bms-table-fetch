name: Release Build
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: codeberg-medium
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        env:
          GIT_DEFAULT_HASH: sha256

      - name: Install Rust Toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: https://github.com/Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Artifacts
        run: |
          mkdir -p dist
          cp target/release/bms-table-fetch dist/
          tar -cJf "dist/bms-table-fetch-${{ forge.ref_name }}-linux-amd64.tar.xz" \
            -C dist bms-table-fetch
          sha256sum "dist/bms-table-fetch-${{ forge.ref_name }}-linux-amd64.tar.xz" \
            > "dist/bms-table-fetch-${{ forge.ref_name }}-linux-amd64.tar.xz.sha256"

      - name: Upload Release Assets
        env:
          FORGEJO_TOKEN: "${{ forge.token }}"
          FORGEJO_API_URL: "${{ forge.api_url }}"
          TAG: "${{ forge.ref_name }}"
          REPO: "${{ forge.repository }}"
        run: |
          set -euo pipefail

          # URL-encode tag for path (e.g. slashes in tag names)
          TAG_URL=$(echo "$TAG" | sed 's/\//%2F/g')

          echo "Looking up release for tag $TAG ..."
          RELEASE_JSON=$(curl -sSf -H "Authorization: token $FORGEJO_TOKEN" \
            "$FORGEJO_API_URL/repos/$REPO/releases/tags/$TAG_URL")

          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
          echo "Found release ID: $RELEASE_ID"

          for file in dist/*; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            echo "Uploading $filename ..."
            curl -sSf -X POST -H "Authorization: token $FORGEJO_TOKEN" \
              -H "Content-Type: multipart/form-data" \
              -F "attachment=@$file" \
              "$FORGEJO_API_URL/repos/$REPO/releases/$RELEASE_ID/assets?name=$filename" \
              | jq .
          done

          echo "All assets uploaded successfully"
