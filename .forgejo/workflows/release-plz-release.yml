name: Release-plz Release

on:
  workflow_dispatch:

jobs:
  release-plz-release:
    name: Publish crates and create release
    runs-on: codeberg-medium

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        env:
          GIT_DEFAULT_HASH: sha256
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust toolchain
        id: rust
        uses: https://codeberg.org/brightmeows/rust-toolchain-action@v0.1.0
        with:
          toolchain: stable
          profile: minimal

      - name: Restore cargo cache
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ steps.rust.outputs.cachekey }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            rust-${{ runner.os }}-

      - name: Install release-plz
        run: |
          curl -fsSL \
            "https://github.com/release-plz/release-plz/releases/download/release-plz-v0.3.158/release-plz-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/release-plz.tar.gz
          tar xzf /tmp/release-plz.tar.gz -C /tmp
          install /tmp/release-plz /usr/local/bin/ 2>/dev/null || \
            install /tmp/release-plz-*/release-plz /usr/local/bin/

      - name: Configure git user
        run: |
          git config --global user.name "BrightMeowS"
          git config --global user.email "brightmeows@163.com"

      - name: Create release
        run: |
          release-plz release \
            --forge gitea \
            --git-token "${{ secrets.GITHUB_TOKEN }}"
