[[package]]
name = "bms-table-fetch"
publish = false

[workspace]
# Repository URL for changelog links and PR creation.
# Auto-detected from git remote; explicit for safety.
repo_url = "https://codeberg.org/brightmeows/bms-table-fetch"

# Enable semver checks for early detection of breaking API changes.
# (On 0.x, cargo-semver-checks flags any public API change as
# semver-incompatible, which is expected.)
semver_check = true

# Generate per-crate CHANGELOG.md on each release PR.
changelog_update = true

# Use git tags (not crates.io) as the source of truth for released versions.
# Without this, `publish = false` causes a deadlock where release-plz refuses
# to create new PRs because the tag exists but the package was never published
# to crates.io (see release-plz#1139).
git_only = true

[changelog]
# Group conventional commits into descriptive sections.
# Covers standard conventional commit types beyond the default set
# (which lumps everything except feat/fix into "Other").
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^perf", group = "Performance" },
    { message = "^test", group = "Testing" },
    { message = "^docs", group = "Documentation" },
    { message = "^ci", group = "CI" },
    { message = "^security", group = "Security" },
    { message = "^deprecated", group = "Deprecations" },
    { message = "^revert", group = "Reverts" },
    { message = "^.*", group = "Other" },
]
